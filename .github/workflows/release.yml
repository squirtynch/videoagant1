name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller>=6.0.0
    
    - name: Run tests
      run: |
        PYTHONPATH=src pytest tests/unit -v --tb=short
    
    - name: Build with PyInstaller
      run: |
        mkdir -p build
        echo \"\"\"
        from PyInstaller.utils.hooks import collect_submodules, collect_data_files
        
        a = Analysis(
            ['src/video_agent/main.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=[
                'PySide6',
                'sqlalchemy',
                'pydantic',
                'structlog',
            ] + collect_submodules('video_agent'),
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=None,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=None)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='AI-Video-Agent',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,
        )
        \"\"\" > build/app.spec
        
        pyinstaller build/app.spec --distpath dist --workpath build/temp --specpath build
      shell: bash
    
    - name: Create installer with Inno Setup
      run: |
        # Copy executable to installer directory
        mkdir -p installer/input
        copy dist\AI-Video-Agent.exe installer\input\
        
        # Create basic ISS file
        echo \"\"\"
        [Setup]
        AppName=AI Video Agent
        AppVersion=${{ github.ref_name }}
        DefaultDirName={autopf}\\AI Video Agent
        DefaultGroupName=AI Video Agent
        OutputDir=output
        OutputBaseFilename=AI-Video-Agent-Setup-${{ github.ref_name }}
        
        [Files]
        Source: \"input\\AI-Video-Agent.exe\"; DestDir: \"{app}\"
        
        [Icons]
        Name: \"{group}\\AI Video Agent\"; Filename: \"{app}\\AI-Video-Agent.exe\"
        Name: \"{autodesktop}\\AI Video Agent\"; Filename: \"{app}\\AI-Video-Agent.exe\"
        \"\"\" > installer/setup.iss
        
        # Note: Inno Setup compiler (iscc) needs to be installed on the runner
        # For now, we'll just package the executable
        Compress-Archive -Path dist\AI-Video-Agent.exe -DestinationPath dist\AI-Video-Agent-Windows.zip
      shell: pwsh
    
    - name: Generate checksums
      run: |
        cd dist
        $files = Get-ChildItem -File
        foreach ($file in $files) {
          $hash = Get-FileHash -Path $file -Algorithm SHA256
          Add-Content -Path checksums.txt -Value "$($hash.Hash)  $($file.Name)"
        }
      shell: pwsh
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AI-Video-Agent.exe
          dist/AI-Video-Agent-Windows.zip
          dist/checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
