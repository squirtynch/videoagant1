name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install FFmpeg via Chocolatey
      shell: pwsh
      run: |
        choco install ffmpeg -y --no-progress
        RefreshEnv
        
    - name: Verify FFmpeg Installation
      shell: pwsh
      run: |
        ffmpeg -version
        Write-Host "FFmpeg path: $(where.exe ffmpeg)"

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pyinstaller>=6.0.0
        pip install pywin32-ctypes

    - name: Run tests
      shell: pwsh
      env:
        PYTHONPATH: ${{ github.workspace }}\src
      run: |
        pytest tests/unit -v --tb=short

    - name: Ensure build directory exists
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build | Out-Null

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        # Run pyinstaller from workspace root with correct spec path
        pyinstaller --workpath "${{ github.workspace }}\\build\\temp" --distpath "${{ github.workspace }}\\dist" --specpath "${{ github.workspace }}\\build" "${{ github.workspace }}\\build\\app.spec" --noconfirm

    - name: Validate executable
      shell: pwsh
      run: |
        if (Test-Path "dist/AI-Video-Agent.exe") {
          Write-Host "Executable created successfully"
          Get-Item "dist/AI-Video-Agent.exe" | Select-Object Name, Length
        } else {
          Write-Error "Executable not found"
          Get-ChildItem dist -Recurse | Select-Object FullName
          exit 1
        }

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        RefreshEnv

    - name: Build Installer with Inno Setup
      shell: pwsh
      run: |
        iscc installer/setup.iss /O"${{ github.workspace }}\dist" /F"AI-Video-Agent-Setup-${{ github.ref_name }}"
        
    - name: Validate installer
      shell: pwsh
      run: |
        if (Test-Path "dist/AI-Video-Agent-Setup-*.exe") {
          Write-Host "Installer created successfully"
          Get-ChildItem dist -Filter "*.exe" | Select-Object Name, Length
        } else {
          Write-Warning "Installer not found, listing dist contents:"
          Get-ChildItem dist -Recurse | Select-Object FullName
          # Don't fail here if tag isn't present, just warn
        }

    - name: Upload application artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Video-Agent-Windows
        path: dist/AI-Video-Agent.exe
        if-no-files-found: error

    - name: Upload installer artifact (if exists)
      uses: actions/upload-artifact@v4
      if: hashFiles('dist/AI-Video-Agent-Setup-*.exe') != ''
      with:
        name: AI-Video-Agent-Installer
        path: dist/AI-Video-Agent-Setup-*.exe
        if-no-files-found: ignore

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/AI-Video-Agent.exe
          dist/AI-Video-Agent-Setup-*.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
